<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in – Payday Planner</title>
<meta name="theme-color" content="#14231e">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--sf:#fff;--ink:#14231e;--mut:#5d6d66;--ln:#d9e0db;--goal:#2b5ea7;--acc:#14231e;--accf:#fff;--res:#a8700f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1714;--sf:#18231f;--ink:#e8efeb;--mut:#93a39b;--ln:#2a3a34;--goal:#7fa8ec;--acc:#e8efeb;--accf:#0f1714;--res:#e0aa4f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
main{max-width:420px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:inherit;text-decoration:none;margin:8px 0 24px}
.logo img{width:32px;height:32px;border-radius:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:22px}
h1{font-size:24px;margin:0 0 14px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
label{display:block;font-size:14px;color:var(--mut);margin-top:12px}
input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:4px}
.btn{display:block;width:100%;background:var(--acc);color:var(--accf);border:0;border-radius:8px;padding:12px;font:inherit;font-weight:600;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ln)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.msg{border-left:4px solid var(--res);background:var(--bg);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px;margin-bottom:10px}
.msg.ok{border-color:var(--goal)}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0;padding:0;list-style:none}
.hint li{padding:1px 0}
.hint li.ok{color:var(--goal)}
.hint li::before{content:'○ '}
.hint li.ok::before{content:'✓ '}
.lnk{background:none;border:0;color:var(--goal);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline}
.fine{font-size:13px;color:var(--mut);margin-top:14px;text-align:center}
a{color:var(--goal)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--goal);outline-offset:2px}
</style>
</head>
<body>
<main>
<a class="logo" href="index.html?home"><img src="icon-192.png" alt="">Payday Planner</a>
<div class="card">
<div id="msg" class="msg" role="alert" hidden></div>
<div class="tabs" role="tablist"><button id="tIn" class="on" role="tab" aria-selected="true" type="button">Sign in</button><button id="tUp" role="tab" aria-selected="false" type="button">Create account</button></div>
<h1 id="ttl">Welcome back</h1>
<form id="f" novalidate>
<label id="nameL" hidden>Name<input id="nm" autocomplete="name"></label>
<label>Email<input id="em" type="email" autocomplete="email" inputmode="email"></label>
<label>Password<input id="pw" type="password" autocomplete="current-password"></label>
<ul class="hint" id="pwh" hidden aria-live="polite"></ul>
<button class="btn" id="go" type="submit" disabled>Sign in</button>
<div class="fine" id="consent" hidden>By creating an account you agree to the <a href="terms.html">Terms of Service</a> and the <a href="privacy.html">Privacy Policy</a>.</div>
<button class="lnk" id="forgot" type="button">Forgot your password?</button>
</form>
<form id="rf" novalidate hidden><label>New password<input id="np" type="password" autocomplete="new-password"></label><ul class="hint" id="nph" aria-live="polite"></ul><button class="btn" id="rgo" type="submit">Save new password</button></form>
<div class="fine"><a href="index.html?home">Back to the home page</a></div>
</div>
</main>
<script src="sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script>
var up=false,$=function(i){return document.getElementById(i)};
var C=window.PP_CONFIG,sb=null;
try{if(C&&window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){}
var APP=new URL('app.html',location.href).href,HERE=new URL('auth.html',location.href).href;
var RULES=[['At least 8 characters',function(p){return p.length>=8}],['An uppercase letter (A to Z)',function(p){return /[A-Z]/.test(p)}],['A lowercase letter (a to z)',function(p){return /[a-z]/.test(p)}],['A number (0 to 9)',function(p){return /[0-9]/.test(p)}],['A symbol, such as ! - _ @ # $ %',function(p){return /[^A-Za-z0-9\s]/.test(p)}]];
function drawRules(ul,p){ul.innerHTML=RULES.map(function(r){return '<li class="'+(r[1](p)?'ok':'')+'">'+r[0]+'</li>'}).join('')}
function missing(p){return RULES.filter(function(r){return !r[1](p)}).map(function(r){return r[0].toLowerCase()})}
function needMsg(p){var m=missing(p);return m.length?'Your password still needs: '+m.join('; ')+'.':''}
function say(t,ok){var m=$('msg');if(!t){m.hidden=true;return}m.textContent=t;m.className='msg'+(ok?' ok':'');m.hidden=false}
function nice(e){var m=(e&&e.message||'').toLowerCase();
if(m.indexOf('invalid login')>-1)return 'The email or password is not right.';
if(m.indexOf('not confirmed')>-1)return 'Please confirm your email first. Check your inbox for the link.';
if(m.indexOf('already')>-1)return 'An account with this email already exists. Try signing in.';
if(m.indexOf('password')>-1)return (e.message||'That password is not accepted.').replace(/^AuthWeakPasswordError:\s*/i,'');
if(m.indexOf('rate')>-1||m.indexOf('too many')>-1||(e&&e.status===429))return 'Too many tries. Please wait a few minutes and try again.';
if(m.indexOf('fetch')>-1||m.indexOf('network')>-1)return 'Could not reach the server. Check your connection and try again.';
return 'Something went wrong. Please try again.'}
function mode(u){up=u;$('tIn').className=u?'':'on';$('tUp').className=u?'on':'';
$('tIn').setAttribute('aria-selected',!u);$('tUp').setAttribute('aria-selected',u);
$('ttl').textContent=u?'Create your account':'Welcome back';
$('nameL').hidden=!u;$('go').textContent=u?'Create account':'Sign in';$('forgot').hidden=u;
$('pw').autocomplete=u?'new-password':'current-password';$('pwh').hidden=!u;$('consent').hidden=!u;if(u)drawRules($('pwh'),$('pw').value);say('')}
function ready(){$('go').disabled=!sb||!$('em').value.trim()||!$('pw').value}
$('tIn').onclick=function(){mode(false)};$('tUp').onclick=function(){mode(true)};
if(/[?&]new\b/.test(location.search))mode(true);
['em','pw'].forEach(function(i){$(i).addEventListener('input',ready)});
$('pw').addEventListener('input',function(){if(up)drawRules($('pwh'),$('pw').value)});
$('np').addEventListener('input',function(){drawRules($('nph'),$('np').value)});drawRules($('nph'),'');
if(!sb)say('Accounts cannot load right now. You can still use the planner without one.');
$('f').addEventListener('submit',async function(e){e.preventDefault();if(!sb)return;
var em=$('em').value.trim(),pw=$('pw').value;
if(!/^\S+@\S+\.\S+$/.test(em)){say('Please enter a valid email address.');return}
if(up&&needMsg(pw)){say(needMsg(pw));return}
$('go').disabled=true;say('');
try{
if(up){var r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('nm').value.trim()},emailRedirectTo:APP}});
if(r.error)throw r.error;
if(r.data&&r.data.session){location.href=APP;return}
if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){say('An account with this email already exists. Try signing in.');$('go').disabled=false;return}
say('Almost done. We sent a link to '+em+'. Open it to confirm your email, then come back and sign in.',true);$('go').disabled=false}
else{var r2=await sb.auth.signInWithPassword({email:em,password:pw});if(r2.error)throw r2.error;location.href=APP}
}catch(err){say(nice(err));$('go').disabled=false}});
$('forgot').onclick=async function(){if(!sb)return;var em=$('em').value.trim();
if(!/^\S+@\S+\.\S+$/.test(em)){say('Type your email above first, then tap "Forgot your password?".');return}
try{var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:HERE});if(r.error)throw r.error;say('If an account exists for '+em+', we sent a link to reset your password.',true)}catch(err){say(nice(err))}};
function showReset(){$('f').hidden=true;document.querySelector('.tabs').hidden=true;$('rf').hidden=false;$('ttl').textContent='Choose a new password';say('')}
$('rf').addEventListener('submit',async function(e){e.preventDefault();var p=$('np').value;
if(needMsg(p)){say(needMsg(p));return}
try{var r=await sb.auth.updateUser({password:p});if(r.error)throw r.error;say('Password saved. Taking you to the planner…',true);setTimeout(function(){location.href=APP},900)}catch(err){say(nice(err))}});
if(sb){sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')showReset()});
if(!/type=recovery/.test(location.hash)){sb.auth.getSession().then(function(r){if(r&&r.data&&r.data.session)location.replace(APP)})}}
</script>
</body>
</html>
