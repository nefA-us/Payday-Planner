<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Planner</title>
<meta name="theme-color" content="#14231e">
<meta name="description" content="Plan each paycheck, upcoming bills and savings goals on a calendar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payday">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column. Header with account + save status, notes, tab bar, then the active view. */
:root{--bg:#f2f5f1;--sf:#fff;--ink:#14231e;--mut:#5d6d66;--ln:#d9e0db;--inc:#1d7a4b;--exp:#b3402e;--goal:#2b5ea7;--res:#a8700f;--acc:#14231e;--accf:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1714;--sf:#18231f;--ink:#e8efeb;--mut:#93a39b;--ln:#2a3a34;--inc:#5fc88f;--exp:#f08a76;--goal:#7fa8ec;--res:#e0aa4f;--acc:#e8efeb;--accf:#0f1714}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1714;--sf:#18231f;--ink:#e8efeb;--mut:#93a39b;--ln:#2a3a34;--inc:#5fc88f;--exp:#f08a76;--goal:#7fa8ec;--res:#e0aa4f;--acc:#e8efeb;--accf:#0f1714}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1000px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ink)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--accf);border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ln)}
.btn.del{background:none;color:var(--exp);border:1px solid var(--exp)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--goal);outline-offset:2px}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);min-width:0}
.acct img{width:22px;height:22px;border-radius:50%}
.pill{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--mut);cursor:default}
.pill.ok{color:var(--inc)}.pill.warn{color:var(--res)}.pill.bad{color:var(--exp);cursor:pointer}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--ln);border-left:4px solid var(--goal);background:var(--sf);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.note .acts{margin:0}
.center{max-width:460px;margin:40px auto;text-align:center}
.zone{margin-top:16px;padding-top:10px;border-top:1px solid var(--ln)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 14px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.lbl{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.goal{color:var(--goal)}.res{color:var(--res)}
.hero{border-left:5px solid var(--inc);margin-bottom:10px}
.hero.short{border-color:var(--exp)}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--goal)}
.alert{border-left:4px solid var(--res);background:var(--sf);padding:8px 12px;margin-bottom:8px;border-radius:0 6px 6px 0}
.alert.bad{border-color:var(--exp)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head h2{margin:0;flex:1}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:3px;margin-top:2px;padding:1px 3px;font-size:11px;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:color-mix(in srgb,currentColor 14%,transparent)}
.scroll{overflow-x:auto}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(170px,1.4fr);min-width:860px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.mh{padding:6px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--ln);background:var(--bg)}
.mc{min-height:104px;padding:4px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.ps{padding:6px 8px;font-size:12px;background:var(--bg);border-bottom:1px solid var(--ln);min-width:0}
.ps .row{padding:2px 0;gap:6px}
.psh{font-weight:600;margin-bottom:3px}
.mc.out{background:var(--bg)}.mc.out .nm{color:var(--mut);opacity:.6}
.mc:hover{background:color-mix(in srgb,var(--goal) 7%,var(--sf))}
.nm{font-size:12px;font-weight:600;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%}
.mc.today .nm{background:var(--goal);color:var(--sf)}
.mc .chip{font-size:11px;padding:2px 4px}
.more{font-size:11px;color:var(--mut);font-weight:600}
.db{margin-top:auto;font-size:10px;color:var(--mut);text-align:right}
.db.neg{color:var(--exp);font-weight:600}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:13px}
@media (max-width:560px){.mc{min-height:64px;padding:2px}.mc .chip{font-size:9px;padding:1px 2px}.db{display:none}.big{font-size:22px}}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--sf)}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--mut);font-weight:600}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);padding:16px;width:min(380px,92vw)}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);margin-top:2px}
.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.small{font-size:12px;color:var(--mut)}
/* Pop-ups (entry, goal, settings): fit small screens, scroll when tall, and avoid the iPhone zoom on focus */
dialog{max-width:calc(100vw - 24px);max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain}
dialog input,dialog select{font-size:16px;min-height:40px;color:var(--ink)}
dialog input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;text-align:left}
dialog .btn{min-height:40px}
dialog .acts{flex-wrap:wrap}
@media (max-width:560px){dialog{width:min(440px,calc(100vw - 24px));margin:max(12px,env(safe-area-inset-top,0px)) auto auto;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px))}}
/* Upgrade: occurrences, paid state, mobile calendar, toast */
[hidden]{display:none!important}
.chip.paid{text-decoration:line-through;opacity:.6}
.lk{background:none;border:0;text-align:left;padding:0;font:inherit;cursor:pointer;color:inherit;min-width:0;flex:1}
.paid .lk{text-decoration:line-through;opacity:.6}
.btn.sm{padding:4px 10px;font-size:13px}
.row>span:last-child{white-space:nowrap}
.tag{font-size:11px;font-weight:700;color:var(--exp);border:1px solid var(--exp);border-radius:999px;padding:0 6px;margin-left:4px}
dialog .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-top:12px}
dialog .chk input{width:22px;height:22px;min-height:0;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accf);padding:8px 8px 8px 14px;border-radius:8px;display:flex;gap:10px;align-items:center;z-index:50;max-width:calc(100vw - 24px);box-shadow:0 4px 16px #0005}
.toast .btn{background:none;color:var(--accf);border:1px solid var(--accf);padding:4px 10px}
.cal-mini{display:none}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.mm{border:0;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);background:none;font:inherit;color:inherit;min-height:54px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mm.out{background:var(--bg);opacity:.55}
.mm.today .nm{background:var(--goal);color:var(--sf)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dot{display:block;width:7px;height:7px;border-radius:50%;color:var(--exp);background:currentColor}
.dot.i{color:var(--inc)}
.dot.p{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.legend{font-size:12px;color:var(--mut);margin:6px 0}
.pw{margin-top:8px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.row2 .row{border:0}
@media (max-width:700px){.cal-wide{display:none}.cal-mini{display:block}.cal-head .btn{padding:7px 10px}}
/* Standalone page: keep content clear of phone status bars and home indicators */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Payday Planner</h1><div class="hr"><span class="acct" id="acct"></span><button class="pill" id="stat" type="button">Connecting…</button><button class="btn ghost" id="bSet" type="button">Settings</button></div></header>
<div id="notes"></div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<dialog id="dlg"></dialog>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const DAY=864e5,TABS=['Dashboard','Calendar','Month ahead','Spending','Entries','Goals'];
const CATS=['Housing','Utilities','Food','Transport','Insurance','Subscriptions','Debt','Health','Fun','Savings','Other'];
let S=null,tab='Dashboard',cm=new Date(),spm=new Date();cm.setDate(1);spm.setDate(1);
// Account and storage state
let mode='local',state='loading',status='loading',ref=null,account=null,readonly=false,dirty=false,saving=false,first=false,slow=false,notice='',errMsg='',wipeArmed=false,delArmed=false,qt=0,slowT=0,retried=false,dlgDay=null,tT=0;
const $=s=>document.querySelector(s);
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=n=>(n<-.5?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const r2=n=>Math.round(n*100)/100;
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const sd=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const sdy=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const t=today(),f=addD(t,-((t.getDay()+2)%7)),m=d=>ymd(new Date(t.getFullYear(),t.getMonth(),d));
return{set:{payday:5,bal:600,asof:ymd(t),buf:100},nid:30,
e:[{id:1,n:'Paycheck',a:900,t:'i',d:ymd(f),r:'w',cat:'Paycheck'},{id:2,n:'Rent',a:1000,t:'e',d:m(1),r:'m',cat:'Housing'},{id:3,n:'Utilities',a:150,t:'e',d:m(5),r:'m',cat:'Utilities'},{id:4,n:'Phone',a:80,t:'e',d:m(12),r:'m',cat:'Utilities'},{id:5,n:'Subscriptions',a:35,t:'e',d:m(15),r:'m',cat:'Subscriptions'},{id:6,n:'Car payment',a:350,t:'e',d:m(28),r:'m',cat:'Transport'},{id:7,n:'Insurance',a:140,t:'e',d:m(28),r:'m',cat:'Insurance'},{id:8,n:'Groceries',a:110,t:'e',d:ymd(addD(f,1)),r:'w',cat:'Food'},{id:9,n:'Credit card minimum',a:60,t:'e',d:m(20),r:'m',cat:'Debt'}],
g:[{id:1,n:'Emergency fund',k:'s',t:2000,s:300,d:'',p:3},{id:2,n:'Vacation',k:'s',t:800,s:0,d:ymd(addD(t,120)),p:2},{id:3,n:'Credit card',k:'d',o:1800,i:22,m:60,t0:2400,d:ymd(addD(t,300)),p:4}],acc:{},demo:true}}
const blank=()=>({set:{payday:5,bal:0,asof:ymd(today()),buf:0},nid:1,e:[],g:[],acc:{},demo:false});
const norm=o=>({set:Object.assign({payday:5,bal:0,asof:ymd(today()),buf:0},o.set||{}),nid:+o.nid||100,e:Array.isArray(o.e)?o.e:[],g:Array.isArray(o.g)?o.g:[],acc:o.acc&&typeof o.acc==='object'?o.acc:{},demo:!!o.demo});
const clean=()=>JSON.parse(JSON.stringify(S));
// Local (signed-out) storage
function localLoad(){try{const o=JSON.parse(localStorage.getItem('payday1'));if(o&&Array.isArray(o.e))S=norm(o)}catch(e){}if(!S)S=seed()}
function localSave(){try{localStorage.setItem('payday1',JSON.stringify(S))}catch(e){}}
// Saving: cloud documents are written one at a time, after a short pause
function save(){if(mode==='cloud'){if(readonly)return;dirty=true;queue()}else localSave()}
function queue(){clearTimeout(qt);qt=setTimeout(flush,300);paint('saving')}
async function flush(){if(!ref||saving||!dirty||state!=='ready')return;saving=true;dirty=false;paint('saving');let err=null;
try{await ref.set(clean())}catch(e){err=e||{}}
saving=false;
if(!err){retried=false;if(dirty)queue();else paint('saved');return}
if(err.code==='invalid_argument'){readonly=true;paint('readonly');render();return}
dirty=true;paint('error');
if(err.code==='unavailable'&&!retried){retried=true;setTimeout(flush,1500)}}
const LBL={saved:['Saved to your account','ok'],saving:['Saving…',''],error:['Not saved. Tap to retry','bad'],readonly:['View only, changes are not saved','warn'],local:['Saved in this browser only','warn'],loading:['Connecting…','']};
function paint(s){if(s)status=s;const b=$('#stat'),l=LBL[status]||LBL.loading;b.textContent=l[0];b.className='pill '+l[1];
$('#acct').innerHTML=account&&mode==='cloud'?`<img src="${esc(account.avatarUrl)}" alt=""><span>${esc(account.name||'You')}</span>`:''}
// First visit for this account: move the old browser copy if there is one, otherwise start with samples
async function firstRun(){first=true;let init=null,moved=false;
try{const o=JSON.parse(localStorage.getItem('payday1'));if(o&&Array.isArray(o.e)){init=norm(o);moved=true}}catch(e){}
if(!init)init=seed();
S=init;
try{await ref.set(clean());state='ready';clearTimeout(slowT);
if(moved){try{localStorage.removeItem('payday1')}catch(e){}notice='Your planner was moved from this browser to your account. The copy in this browser has been removed.'}
paint('saved')}
catch(err){state='ready';clearTimeout(slowT);if(err&&err.code==='invalid_argument'){readonly=true;paint('readonly')}else{dirty=true;paint('error')}}
first=false;render()}
function onSnap(snap){if(mode!=='cloud'||state==='deleted'||first)return;
if(snap.exists){const d=norm(snap.data());
if(state!=='ready'){S=d;state='ready';clearTimeout(slowT);paint(readonly?'readonly':'saved');render();return}
if(snap.metadata.hasPendingWrites||dirty||saving)return;
if(JSON.stringify(d)!==JSON.stringify(S)){S=d;render()}}
else if(state==='loading'&&!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites)firstRun()}
function onSnapErr(e){clearTimeout(slowT);if(state==='loading'){state='error';errMsg=e&&e.code==='revoked'?'Your access to this page changed. Ask the person who shared it to share it with you again.':'Your saved data could not be reached'+(e&&e.code?' ('+e.code+')':'')+'. Close this page and open it again to retry.';render()}else paint('error')}
async function boot(){paint('loading');render();
let db=null,user=null,me=null;
try{if(window.claude&&window.claude.use){const r=await Promise.all([claude.use('db'),claude.use('user')]);db=r[0];user=r[1]}}catch(e){}
if(user){try{me=await user.me()}catch(e){}}
if(db&&me&&me.id){mode='cloud';account=me;
try{ref=db.doc('data/users/'+me.id+'/planner');slowT=setTimeout(()=>{if(state==='loading'){slow=true;render()}},10000);ref.onSnapshot(onSnap,onSnapErr)}
catch(e){onSnapErr(e)}}
else{mode='local';localLoad();state='ready';paint('local');render()}}
const wkStart=d=>addD(d,-((d.getDay()-S.set.payday+7)%7));
// Pattern dates of an entry (before any one-off changes), inside [a,b]
function occ(e,a,b){const o=[],s=pd(e.d);
if(e.r==='o'){if(s>=a&&s<=b)o.push(s)}
else if(e.r==='w'||e.r==='b'){const st=e.r==='w'?7:14;let d=new Date(s);if(d<a)d=addD(d,Math.ceil(Math.round((a-d)/DAY)/st)*st);for(;d<=b;d=addD(d,st))o.push(d)}
else{let c=new Date(a.getFullYear(),a.getMonth(),1);while(c<=b){const last=new Date(c.getFullYear(),c.getMonth()+1,0).getDate(),d=new Date(c.getFullYear(),c.getMonth(),Math.min(s.getDate(),last));if(d>=s&&d>=a&&d<=b)o.push(d);c=new Date(c.getFullYear(),c.getMonth()+1,1)}}
return e.end?o.filter(d=>ymd(d)<=e.end):o}
// Real occurrences in [a,b]: applies skips, moved dates, amount changes and paid marks. k is the original pattern date.
function items(a,b){const out=[],A=addD(a,-45),B=addD(b,45);
S.e.forEach(e=>{const seen={};
occ(e,A,B).forEach(p=>{const k=ymd(p),x=e.ex&&e.ex[k];seen[k]=1;if(x&&x.s)return;const d=x&&x.md?pd(x.md):p;if(d>=a&&d<=b)out.push({e,d,k,a:x&&x.a!=null?+x.a:+e.a,p:!!(x&&x.p)})});
if(e.ex)for(const k in e.ex){const x=e.ex[k];if(seen[k]||x.s||!x.md||k<e.d||(e.end&&k>e.end))continue;const d=pd(x.md);if(d>=a&&d<=b)out.push({e,d,k,a:x.a!=null?+x.a:+e.a,p:!!x.p})}});
return out.sort((x,y)=>x.d-y.d||x.e.t.localeCompare(y.e.t))}
const exOf=(e,k)=>{if(!e.ex)e.ex={};return e.ex[k]||(e.ex[k]={})};
function tidy(e,k){if(e.ex&&e.ex[k]&&!Object.keys(e.ex[k]).length)delete e.ex[k];if(e.ex&&!Object.keys(e.ex).length)delete e.ex}
// Mark one occurrence paid or received. If it falls after the balance date, the balance moves with it.
function setPaid(e,k,on){const x=exOf(e,k),eff=pd(x.md||k),amt=x.a!=null?+x.a:+e.a,as=pd(S.set.asof),sg=e.t==='i'?1:-1;
if(on){x.p=1;if(eff>=as){S.set.bal=r2(+S.set.bal+sg*amt);x.pb=amt}else x.pb=0}
else{if(x.pb&&eff>=as)S.set.bal=r2(+S.set.bal-sg*x.pb);delete x.p;delete x.pb}
tidy(e,k)}
const keyOf=s=>{const i=s.indexOf(':');return[+s.slice(0,i),s.slice(i+1)]};
// Goals
const room=g=>g.k==='d'?Math.max(0,g.rem*(1+g.r)-g.mw):g.rem;
const pay=(B,r,n)=>r>0?B*r/(1-Math.pow(1+r,-n)):B/n;
function dist(amt,G){const out={},R={};G.forEach(g=>{out[g.id]=0;R[g.id]=room(g)});
// Goals are funded last, from what is left after bills, reserves and the buffer.
// A dated goal takes only its even share toward the target (highest priority first).
[...G].sort((a,b)=>b.p-a.p).forEach(g=>{if(g.dated){const x=Math.max(0,Math.min(g.need,R[g.id],amt));out[g.id]+=x;R[g.id]-=x;amt-=x}});
// Goals without a date share whatever is left, by priority.
for(let i=0;i<6&&amt>.5;i++){const o=G.filter(g=>!g.dated&&R[g.id]>.5);if(!o.length)break;const tw=o.reduce((s,g)=>s+g.p,0),base=amt;o.forEach(g=>{const x=Math.min(R[g.id],base*g.p/tw);out[g.id]+=x;R[g.id]-=x;amt-=x})}

if(k==='d'){if(!(+v('go')>0))return;o={n:v('gn').trim(),k:'d',o:+v('go'),i:+v('gi')||0,m:+v('gm')||0,t0:+v('g0')||+v('go'),d:v('gd'),p:+v('gp')}}
else{if(!(+v('gt')>0))return;o={n:v('gn').trim(),k:'s',t:+v('gt'),s:+v('gs')||0,d:v('gd'),p:+v('gp')}}
if(id){const i=S.g.findIndex(x=>x.id==id);if(i>=0)S.g[i]={id,...o}}else S.g.push({id:S.nid++,...o});save();$('#dlg').close();render()}
else if('gdel'in d){const g=S.g.find(x=>x.id==d.gdel),sn=snap();S.g=S.g.filter(x=>x.id!=d.gdel);save();$('#dlg').close();render();toast('Deleted '+(g?g.n:'goal'),sn)}
else if('sset'in d){S.set=Object.assign({},S.set,{payday:+v('sp'),bal:+v('sb')||0,asof:v('sa')||ymd(today()),buf:+v('su')||0});save();$('#dlg').close();render()}
else if('bal'in d)balDlg()
else if('bsave'in d){const sn=snap();S.set.bal=r2(+v('bb')||0);S.set.asof=ymd(today());save();$('#dlg').close();render();toast('Balance updated',sn)}
else if('undo'in d){const tt=$('#toast');if(tt._sn){S=norm(JSON.parse(tt._sn));save();tt.hidden=true;tt._sn=null;render()}}
else if('dismiss'in d){notice='';render()}
else if('keep'in d){S.demo=false;save();render()}
else if('clear'in d){const sn=snap();S.e=[];S.g=[];S.acc={};S.set.bal=0;S.set.buf=0;S.demo=false;save();render();toast('Samples cleared',sn)}
else if('ack'in d){S.set.ack=ymd(wkStart(today()));save();render()}
else if('notif'in d){Notification.requestPermission().then(()=>{setDlg();checkNotify()})}
else if('ics'in d)downloadIcs()
else if('wipe'in d){if(!wipeArmed){wipeArmed=true;c.textContent='Click again to delete everything';return}doWipe()}
else if('new'in d){S=blank();state='ready';readonly=false;save();render()}
else if('export'in d)exportData()
else if('import'in d)$('#fileIn').click()});
// Goal type and series scope switch what the pop-up shows
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='gk'){$('#gs-s').hidden=t.value==='d';$('#gs-d').hidden=t.value!=='d'}
if(t.id==='fsc'){$('#fd').value=t.value==='fut'?t.dataset.from:t.dataset.all}});
function exportData(){try{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='payday-planner-backup-'+ymd(today())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(e){notice='The backup file could not be created.';$('#dlg').close();render()}}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.e)||!Array.isArray(o.g))throw new Error('bad');S=norm(o);S.demo=false;save();notice='Backup imported.'}catch(x){notice='That file is not a Payday Planner backup.'}$('#dlg').close();render()};
r.onerror=()=>{notice='That file could not be read.';$('#dlg').close();render()};r.readAsText(f)});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='ready'&&S)render()});
boot();
</script>
